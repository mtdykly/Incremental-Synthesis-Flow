design: riscv-simple-sv

top: riscv_core


# RTL source directories
source_dirs:
  - core/common
  - core/singlecycle


# Exclude simulation-only files
exclude_patterns:
  - "example_*"
  - "*testbench*"


# Verilog include directories
include_dirs:
  - synth
  - core/common


# Language
language: systemverilog